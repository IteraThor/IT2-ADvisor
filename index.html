<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT2-ADvisor</title>
  <meta name="theme-color" content="#0a0d14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="top-nav">
    <div class="nav-brand">
      <span class="nav-logo">🎯</span>
      <span class="nav-title">IT2-ADvisor</span>
    </div>

    <div class="currency-switcher" id="currency-switcher">
      <button type="button" class="currency-btn" data-curr="USD">USD $</button>
      <button type="button" class="currency-btn active" data-curr="EUR">EUR €</button>
      <button type="button" class="currency-btn" data-curr="GBP">GBP £</button>
    </div>

    <div class="nav-links">
      <a href="https://makerworld.com/en/models/1334165" target="_blank" rel="noopener noreferrer">IT2 System ↗</a>
      <a href="https://makerworld.com/en/models/2782096" target="_blank" rel="noopener noreferrer">Baseplate ↗</a>
      <a href="https://github.com/IteraThor/IT2-Documentation" target="_blank" rel="noopener noreferrer">Docs ↗</a>
      <a href="https://discord.com/invite/pZAjmwV5kE" target="_blank" rel="noopener noreferrer">Discord ↗</a>
    </div>
  </header>

  <main class="zen-container">

    <div id="screen-questionnaire" class="screen-view active">
      <div class="progress-wrap">
        <div class="progress-meta">
          <button type="button" id="btn-back" class="btn-text-nav" style="visibility: hidden;">
            ← Back
          </button>
          <span id="step-counter" class="step-counter">Question 1</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill" style="width: 15%;"></div>
        </div>
      </div>

      <div class="card-stage">
        <div id="question-card" class="question-card"></div>
      </div>
    </div>

    <div id="screen-bom" class="screen-view" style="display: none;">
      <div class="bom-reveal-header">
        <div class="badge-ready">✓ Configuration Complete</div>
        <h1 class="reveal-title">Your Custom IT2 Build</h1>
        <p class="reveal-subtitle" id="config-summary-text"></p>
        
        <div class="reveal-actions">
          <button type="button" class="btn-pill btn-pill-primary" id="btn-copy-bom">
            📋 Copy BOM
          </button>
          <button type="button" class="btn-pill btn-pill-secondary" id="btn-export-csv">
            📥 Download CSV
          </button>
          <button type="button" class="btn-pill btn-pill-secondary" id="btn-print-bom">
            🖨️ Print
          </button>
          <button type="button" class="btn-pill btn-pill-outline" id="btn-restart">
            ↺ Restart
          </button>
        </div>
      </div>

      <div class="metrics-strip">
        <div class="metric-card">
          <span class="metric-num" id="metric-wall-holes">3</span>
          <span class="metric-label">Wall Holes</span>
        </div>
        <div class="metric-card">
          <span class="metric-num" id="metric-printed-pieces">9</span>
          <span class="metric-label">3D Printed Files</span>
        </div>
        <div class="metric-card">
          <span class="metric-num" id="metric-print-weight">~780g</span>
          <span class="metric-label">Est. Filament</span>
        </div>
        <div class="metric-card">
          <span class="metric-num" id="metric-fastener-count">26</span>
          <span class="metric-label">Fasteners</span>
        </div>
        <div class="metric-card metric-card-cost">
          <span class="metric-num" id="metric-est-cost">€0</span>
          <span class="metric-label">Est. Build Cost</span>
        </div>
      </div>

      <div class="bom-tables-container" id="bom-tables-container"></div>
    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
